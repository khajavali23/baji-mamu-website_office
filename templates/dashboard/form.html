{% extends 'dashboard/base.html' %}

{% block content %}

<div class="head">
    <div>
        <small>CMS / FORM</small>
        <h1>{{ title }}</h1>
    </div>
</div>

<form method="post" enctype="multipart/form-data" class="form-card">

    {% csrf_token %}

    {% if form.non_field_errors %}
        <div class="error-box">
            {{ form.non_field_errors }}
        </div>
    {% endif %}

    {% for field in form %}

        <label>

            {{ field.label }}

            {% if field.field.required %}
                *
            {% endif %}

            {{ field }}

            {% if field.help_text %}
                <small>{{ field.help_text }}</small>
            {% endif %}

            {% if field.errors %}
                <div class="field-error">
                    {{ field.errors }}
                </div>
            {% endif %}

        </label>

    {% endfor %}

    <div class="form-actions">

        <a
            class="secondary"
            href="{% url 'navigation_list' %}"
        >
            Cancel
        </a>

        <button
            type="submit"
            class="primary"
        >
            Save changes →
        </button>

    </div>

</form>

{% endblock %}
