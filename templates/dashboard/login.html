{% load static %}<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Login</title>
        <link rel="stylesheet" href="{% static 'css/dashboard.css' %}" />
    </head>
    <body class="login-page">
        <form class="login-card" method="post">
            {% csrf_token %}
            <div class="login-logo">AI</div>
            <div class="eyebrow">ARAB INVEST INTRANET</div>
            <h1>Welcome back.</h1>
            <p>Sign in to manage website content.</p>
            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}<label>Username<input name="username" required autofocus /></label
            ><label>Password<input name="password" type="password" required /></label><button>Sign in</button>
        </form>
    </body>
</html>
