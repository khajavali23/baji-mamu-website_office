{% extends 'frontend/base.html' %}{% block content %}<section class="hero"><div class="hero-grid"><div class="hero-copy"><span class="eyebrow">BANNER PREVIEW</span><h1>{{ banner.title }}</h1><p>{{ banner.description }}</p><div class="hero-actions">{% for b in banner.buttons.all %}<a class="hero-btn {% if b.is_main %}main{% endif %}" href="{{ b.target_url }}">{{ b.text }} ↗</a>{% endfor %}</div></div><div class="hero-visual"><div class="hero-image active">{% if banner.image %}<img src="{{ banner.image.url }}">{% else %}<div class="fallback">ARAB<br>INVEST</div>{% endif %}</div></div></div></section>{% endblock %}
